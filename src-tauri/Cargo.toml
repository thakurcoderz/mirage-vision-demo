[package]
name = "identify"
version = "0.1.0"
edition = "2021"

[lib]
name = "identify_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
base64 = "0.22"
serde_json = "1"
tauri-plugin-opener = "2"

[profile.dev.package."*"]
opt-level = 3
